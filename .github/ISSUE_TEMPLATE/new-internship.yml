name: New Internship Submission
description: Submit an internship listing we missed
title: "[New] {Company} — {Role}"
labels: ["new-internship"]
body:
  - type: input
    id: company
    attributes:
      label: Company Name
      placeholder: e.g., Stripe
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Role Title
      placeholder: e.g., Software Engineer Intern
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Application URL
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location(s)
      description: Georgia, Southeast US, or Texas preferred. Remote only if a GA/SE/TX location is also listed.
      placeholder: e.g., Atlanta, GA / Remote
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Role Category
      options:
        - Software Engineering
        - Product Engineering
        - Product Management
        - ML / AI
        - Other
    validations:
      required: true
  - type: checkboxes
    id: flags
    attributes:
      label: Additional Info
      options:
        - label: Offers visa sponsorship
        - label: Requires U.S. citizenship
        - label: Remote friendly
        - label: Requires advanced degree (Master's/PhD)
        - label: Open to international students
        - label: Graduate / master's friendly
