ai:
  model: gemini-3.6-flash
  max_tokens: 1024
  enrichment_prompt: "Analyze this job listing and extract structured metadata.\n\
    Return JSON only, no markdown, no explanation.\n\nCategory rules:\n- swe: software\
    \ engineering (backend, frontend, fullstack, cloud, devops, mobile, etc.)\n- product_engineer:\
    \ product engineer / product engineering roles\n- pm: product manager / product\
    \ management / APM\n- ml_ai: ML engineer, AI engineer, LLM, deep learning, NLP,\
    \ CV, research engineer;\n  also \"data scientist\" ONLY when the role is ML/AI\
    \ modeling (not BI/analytics)\n- other: anything else that is still a valid tech\
    \ internship\nReject (set is_internship false) for: hardware, electrical, robotics,\
    \ cybersecurity, IT support,\ndata analyst / BI / analytics-only, quant trading.\n\
    \nIf a job description is provided, use it to determine:\n- remote_friendly: true\
    \ if the description mentions remote work, hybrid, or work-from-home options\n\
    - open_to_international: true if the description does NOT require US citizenship/permanent\
    \ residency,\n  or explicitly mentions visa sponsorship or international candidates\
    \ welcome\n- sponsorship: check for visa sponsorship mentions in the description\n\
    - tech_stack: extract specific technologies mentioned in the description\n\n{\n\
    \  \"is_internship\": true/false,\n  \"season\": \"spring_2027|summer_2027|none\"\
    ,\n  \"start_date\": \"YYYY-MM-DD or YYYY-MM or null\",\n  \"end_date\": \"YYYY-MM-DD\
    \ or YYYY-MM or null\",\n  \"category\": \"swe|ml_ai|pm|product_engineer|other\"\
    ,\n  \"locations\": [\"city, state abbreviation\"],\n  \"is_georgia\": true/false,\n\
    \  \"sponsorship\": \"sponsors|no_sponsorship|us_citizenship|unknown\",\n  \"\
    requires_advanced_degree\": true/false,\n  \"graduate_friendly\": true/false,\n\
    \  \"remote_friendly\": true/false,\n  \"open_to_international\": true/false,\n\
    \  \"tech_stack\": [\"Python\", \"React\", ...],\n  \"industry\": \"fintech|healthcare|energy|ecommerce|banking|automotive|gaming|social_media|cybersecurity|cloud|enterprise|ai_ml|aerospace|telecom|media|food|logistics|semiconductor|other\"\
    ,\n  \"confidence\": 0.0-1.0\n}\n"
  entry_level_enrichment_prompt: "Analyze this job listing and determine if it is\
    \ an entry-level/new-grad full-time tech position.\nThis is NOT an internship\
    \ — we are looking for full-time roles suitable for new grads\nor early-career\
    \ software / product / AI engineers (SWE / SWE I / SWE II / Engineer I-II,\nProduct\
    \ Engineer, Product Manager, AI/ML, roughly 0-2 years).\nReject mid-level, senior,\
    \ staff, or roles requiring more than 2 years of experience.\nReject hardware,\
    \ electrical, robotics, cybersecurity, IT support, data analyst/BI, quant.\nReturn\
    \ JSON only, no markdown, no explanation.\n\nIf a job description is provided,\
    \ use it to determine:\n- remote_friendly: true if the description mentions remote\
    \ work, hybrid, or work-from-home options\n- open_to_international: true if the\
    \ description does NOT require US citizenship/permanent residency,\n  or explicitly\
    \ mentions visa sponsorship or international candidates welcome\n- sponsorship:\
    \ check for visa sponsorship mentions in the description\n- tech_stack: extract\
    \ specific technologies mentioned in the description\n- seniority: new_grad (university/new\
    \ grad programs), swe1 (Engineer I / SWE I),\n  swe2 (Engineer II / SWE II / 1-2\
    \ YOE), mid (3+ YOE or mid-level), senior (Senior/Staff/Lead)\n- max_years_required:\
    \ maximum years of experience required (number), or null if unspecified\n- category:\
    \ swe|ml_ai|pm|product_engineer|other\n  (data scientist only as ml_ai when ML/AI\
    \ modeling; pure analytics → is_entry_level false)\n\n{\n  \"is_entry_level\"\
    : true/false,\n  \"is_internship\": false,\n  \"seniority\": \"new_grad|swe1|swe2|mid|senior\"\
    ,\n  \"max_years_required\": null,\n  \"category\": \"swe|ml_ai|pm|product_engineer|other\"\
    ,\n  \"locations\": [\"city, state abbreviation\"],\n  \"is_georgia\": true/false,\n\
    \  \"sponsorship\": \"sponsors|no_sponsorship|us_citizenship|unknown\",\n  \"\
    requires_advanced_degree\": true/false,\n  \"remote_friendly\": true/false,\n\
    \  \"open_to_international\": true/false,\n  \"tech_stack\": [\"Python\", \"React\"\
    , ...],\n  \"industry\": \"fintech|healthcare|energy|ecommerce|banking|automotive|gaming|social_media|cybersecurity|cloud|enterprise|ai_ml|aerospace|telecom|media|food|logistics|semiconductor|other\"\
    ,\n  \"confidence\": 0.0-1.0\n}\n"
